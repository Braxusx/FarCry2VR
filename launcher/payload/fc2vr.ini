; Far Cry 2 VR (dinput8.dll proxy) settings
[VR]
; 1 = VR on, 0 = DLL loads but leaves rendering untouched, 2 = flat diagnostics (timings in fc2vr.log)
Enable=1
; game units per real-world metre (Dunia appears to use metres)
WorldScale=1.0
; culling frustum enlargement beyond the union of both eye FOVs (prevents edge pop-in)
CullMargin=1.25
; culling mode (F6 cycles in game): 0 = wide VR culling camera (less foliage / distant trees), 1 = wide frustum +
;   flat FOV for LOD, water reflections widened to the VR view (default), 2 = game's own camera,
;   3 = wide frustum and projection + flat FOV (experimental)
CullMode=1
; AdaptiveDetail: removed in v201 (it swung distant detail on and off and saved no frame time).
; 1 = render the shadow maps once per frame (left eye) and reuse them for the right eye - both eyes see the same
;   shadows, and in busy areas this saves a large part of the CPU time per frame. 0 = render them per eye.
ShareShadows=1
; 1 = render each eye with a symmetric field of view plus a hidden border (the game's water reflections assume a
;     centred view and can only reflect what was rendered). Only your real field of view is shown in the headset.
;     F3 cycles in game: headset frustums / symmetric / symmetric + border.
SymmetricFov=1
; hidden border per side, as a fraction of the half field of view (0 = none). Bigger keeps reflections of rocks,
; bridges etc. on screen longer near the edges, but costs GPU time (0.15 / 0.25 renders about 44% more pixels).
OverscanH=0.15
OverscanV=0.25
; 1 = sun shadows cover the whole VR view (the game sized its shadow cascades for the flat screen's field of view)
ShadowFix=1
; last sun shadow cascade range x this (1 = game). F2 switches the VR shadow cascade fixes off/on for comparison.
ShadowFarScale=3.0
; sun shadow zones centered on you, radius = the game's range x this (7 = sharp shadows to 140 m, medium to 420 m). Shift+F2 / Ctrl+F2 raise / lower it live. 0 = game's own fit
ShadowRadialScale=7.0
; sun shadow resolution per cascade (the game uses 2048 at Ultra High; maximum 2730; 0 = game's own)
ShadowMapSize=2720
; eye resolution relative to the headset recommendation (1.0 = native)
RenderScale=1.0
; view height: the height reference follows your sustained real head height over this many seconds
; (0 = fixed at recenter/F8). Quick ducks and leans still move the view.
HeightAdapt=15
; metres added to the view height (negative = lower)
HeightOffset=0.0
; 1 = first-person arms/weapon use each eye's exact projection (fixes the doubled weapon)
FixNearPass=1

; ---------------- HUD / menus / reticle ----------------
; 2 = UI on floating panels (menus/prompts follow the head, reticle follows the gun)
; 1 = older method (UI drawn into each eye), 0 = off
UiMode=2
; overall UI size relative to the eye's field of view
UiScale=0.7
; extra size factor for the menu/prompt panel only (0.8 = 20% smaller)
HudScale=0.8
; in-game pause menu panel: extra size factor on top of HudScale
PauseMenuScale=0.75
; menu/prompt panel distance in metres, and vertical offset in metres (negative = lower)
HudDistance=3.0
UiHeadY=0.0
; reticle distance in metres along the gun's aim
UiDepth=6.0

; ---------------- Draw distance / pop-in ----------------
; LodLevel: no longer used (v199) - draw distance and detail come from the game's own graphics menu.
; DisableAntiPortals: 1 = draw what the game's invisible occluders (inside big rocks / hills) would hide - their test from
;   the flat-screen camera made distant rock faces pop in VR. 0 = game.
DisableAntiPortals=1
; DisableVisibilityTest: 1 = skip the game's occlusion tests (also judged from the flat-screen camera). 0 = game.
DisableVisibilityTest=1

; ---------------- Bouncing NPCs fix (same result as the "Fix Bouncing NPCs" mod) ----------------
; 1 = humans use the non-rigid character controller (animals keep the rigid one)
FixBouncingNpcs=1
; 1 = also limit the game's physics threads to 1, as that mod does
NpcFixThreads=1
; 1 = limit the job threads to 1 as well (that mod's full setting; measured faster in VR - the render thread does the
;   culling itself instead of waiting on other threads). 0 = the game decides
NpcFixJobThreads=1

; ---------------- Binoculars / scopes ----------------
; 1 = while zoomed (monocular, scopes) show the game's zoomed view as a flat screen with black around it
ScopeMode=1
; zoom is detected when the camera field of view drops below this fraction of normal (iron sights stay in VR)
ScopeFovRatio=0.6
; screen distance and width in metres; 1 = screen follows your head, 0 = stays where you looked when zooming
ScopeDistance=1.5
ScopeWidth=1.2
ScopeFollowHead=0

; ---------------- Developer console ----------------
; 1 = typing devmodeon in the game console (~ key) unlocks the developer commands (as Far Cry 2 Multi Fixer does),
;     e.g. domino_Dragunov, domino_AS50, domino_M1903, cheat_GodMode 1, env_hour 12
; 2 = developer commands work without typing devmodeon, 0 = off
DevConsole=1

; ---------------- Freeze / crash reports ----------------
; 1 = if the game stops drawing frames for 5 s, or crashes, write fc2vr_hang_N.txt (+ .dmp) in this folder.
; Ctrl+Shift+F12 writes a report at any time (use it when a scene or script seems stuck).
; The previous session's log is kept as fc2vr_prev.log.
HangWatch=1

; menu / loading screen: distance and width in metres
MenuDistance=3.0
MenuWidth=1.8
; 1 = declare the game DPI-aware. Required with Windows display scaling: otherwise the game window does not fit,
; it fires a resize event every frame and rebuilds all tree geometry each frame (~6 ms of CPU per frame).
DpiAware=1
; 1 = skip swap-chain resizes that change nothing
SkipRedundantReset=1
; 1 = GPU timestamps + CPU sampling profiler in fc2vr.log (diagnostics only)
Profile=0
; Hotkeys: Ctrl+Shift+F12 = freeze report, F3 = symmetric FOV on/off, F6 = cull mode, F7 = capture, F8 = recenter view, F9 = toggle stereo, F10 = frame trace

; ---- motion controllers (Quest Touch) -> the game's Xbox gamepad input
; Left: stick move (click sprint), X reload, Y map, trigger syrette, grip = hand (two-handed grip at the weapon,
;   otherwise grab / use, see HandGrab), menu pause. Iron sight / scope: hold the weapon up to your face.
; Right: stick left/right turn, pull down crouch (click = handbrake / menu back), A jump / change seat, trigger fire,
;   grip = holsters at the body (or grab / use with no weapon in the hand), B tap next weapon slot, B hold next throwable type.
; Hold right grip + left trigger = throw grenade. Weapon holsters (right grip in the zone):
;   over the right shoulder = rifle slot, grab again = special slot; at the hip pointing down = pistol;
;   in front of the chest = machete.
MotionControls=1
; game rumble on the controllers (0 = off)
ControllerRumble=1.0
; 1 = right stick up/down also tilts the view (normally the head does that)
TurnStickPitch=0
; ms that B must be held to switch throwable instead of weapon
ButtonHoldMs=400
; holster zones in metres relative to your head (log the detected zone with LogHolsterZones=1)
ShoulderZoneFwd=-0.02
ShoulderZoneUp=-0.20
HipZoneUp=-0.45
ChestZoneUpMin=-0.55
ChestZoneUpMax=-0.10
LogHolsterZones=0
; ---- weapon and arms in the right hand (stage 2)
; 1 = the first-person arms and weapon follow the right controller
WeaponInHand=1
; 1 = bullets leave from the right controller along its pointing direction (the game's spread is kept)
AimFromController=1
; where the right hand sits relative to the controller grip, metres (X right, Y up, Z back)
HandOffsetX=0
HandOffsetY=0
HandOffsetZ=0
; log the player skeleton's bones once (diagnostics)
DumpSkeleton=0
; ---- arms and two-handed grip (stage 3)
; 1 = arms bend at the elbow from shoulders placed under your head (IK)
ArmIK=1
; 1 = the left hand follows the left controller when it is not holding the weapon
FreeLeftHand=1
; shoulder position relative to your eyes, metres
ShoulderSide=0.17
ShoulderDown=0.22
ShoulderBack=0.06
; left hand within this distance (m) of the foregrip + left grip = hold the weapon with both hands
GrabDistance=0.20
; hands further apart than this in the game's animation = one-handed weapon (pistol: hands come together)
TwoHandMaxSpan=0.65
; never play the idle weapon-inspect animation
NoIdleAnimation=1
; HoldLostTracking: 1 = a controller that loses tracking (held still out of the cameras' view) keeps its last pose instead of the arm snapping to the game's animation
HoldLostTracking=1
; iron sight / scope comes up when the right hand is within SightOnDistance (m) of your head and goes down beyond
; SightOffDistance (CrysisVR: 0.25 / 0.35)
SightOnDistance=0.25
SightOffDistance=0.35
; the scope screen looks along the weapon (1) instead of the game's camera; smoothing time constant in seconds
ScopeFromWeapon=1
ScopeSmoothing=0.06
; aiming dot instead of the game's crosshair: ReticleDistance metres along the weapon (CrysisVR: 10), ReticleSize metres wide there
ReticleDot=1
ReticleDistance=10
ReticleSize=0.06
; ---- hands: grip with a free hand (left hand off the weapon, or the right hand with no weapon)
; picks up an item within GrabRadius (m); let go over a shoulder to put it in the backpack, elsewhere to drop it.
; With nothing to pick up, the hand uses the game's current interaction target (door, vehicle...) within UseReach (m).
HandGrab=1
GrabRadius=0.35
UseReach=0.9
; "over the shoulder" for the backpack, relative to your head (m): behind the face plane, above this height
BackpackZoneFwd=0.0
BackpackZoneUp=-0.25
; ---- scope view: round window with a crosshair; the ammo counter (game screen region from ScopeHudX/ScopeHudY to the
; lower-right corner) is shown inside the window, lower right (ScopeAmmoSize = its width / window). ScopeRoundSize = window
; diameter / ScopeWidth. ScopeGameReticle=1 shows the scope's own reticle from the game.
ScopeRound=1
ScopeRoundSize=0.8
ScopeHudX=0.83
ScopeHudY=0.925
ScopeGameReticle=1
ScopeAmmoSize=0.28
; scoped weapons: the scope view opens as soon as the weapon reaches your face and closes when it leaves (after the
; weapon has been scoped once, so the mod knows it has a scope)
ScopeInstant=1
; food / water: bring it to your mouth to eat or drink it (distance in m)
MouthReach=0.18
; iron sight / scope view only while the left hand holds the weapon (avoids it when reaching over the shoulder)
ScopeNeedsGrip=1
; free left hand turned clockwise (seen from behind) about the controller's pointing axis, degrees
LeftHandRoll=45
; machete held tilted up from the controller's pointing direction, degrees (90 = blade straight up)
MacheteAngle=-28
; v77
; ScopeCrosshair: drawn scope reticle (0 none, 1 duplex, 2 duplex with mil dots)
ScopeCrosshair=2
; LeftHandYaw: free left hand turned inward, degrees
LeftHandYaw=30
; LeftForearmTwist: share of LeftHandRoll carried by the forearm (stops the wrist looking twisted)
LeftForearmTwist=1.0
; MacheteYaw: machete blade angled inward, degrees
MacheteYaw=25
; v78
; ScopeAmmoX/Y: ammo counter centre relative to the scope window centre, in window widths (0.5 = the rim)
ScopeAmmoX=0.59
ScopeAmmoY=-0.30
; v79
; ScopeAmmoMask: ammo counter shown on black (no world behind it)
ScopeAmmoMask=1
; ArmsIndependent: each arm turns only with its own controller; the free left forearm rolls with the left controller
ArmsIndependent=1
; v80
; LodBoost: the LodLevel draw-distance boost on (1) or off (0, game's own distances)
LodBoost=1
; v81
; UpperArmTwist: share of the forearm's turn the upper arm follows (0 = none, 1 = all)
UpperArmTwist=0.5
; ScopeAmmoKey: how different from the world a pixel must be to count as part of the ammo counter (higher = less world shows)
ScopeAmmoKey=24
; (F2 machete pose removed in v82: use the End-key menu)
; v82
; End key: machete hand menu (pitch = MacheteAngle, yaw = MacheteYaw, roll = MacheteRoll). Left stick or Up/Down chooses, right stick or Left/Right adjusts (Shift = 1 deg). End again closes and saves.
MacheteRoll=55
; ScopeAmmoLight: how light a pixel must be to count as ammo-counter text (lower = more of the text, higher = less world)
ScopeAmmoLight=90
; v83
; ScopeAmmoOwn: 1 = the scope view shows the mod's own ammo counter ("Round", rounds in the clip / spare rounds), 0 = the cut-out of the game's counter
ScopeAmmoOwn=1
; v84: grabbing loose objects and throwing
; GrabPhysics: 1 = loose physics objects (bottles, cans, crates...) can be picked up with a free hand's grip
GrabPhysics=1
; GrabMaxMass / GrabMaxSize: heaviest (kg) and largest (radius, m) object a hand can lift
GrabMaxMass=160
GrabMaxSize=1.2
; ThrowScale: the hand's speed at the moment you let go x this = the object's speed; ThrowMaxSpeed caps it (m/s)
ThrowScale=1.3
ThrowMaxSpeed=25
; v86
; GrabReach: a loose object is grabbed when your hand is this close to its surface (m); PickupReach: same for pickup items, measured to the item (m)
GrabReach=0.06
PickupReach=0.20
; v87
; HideInteractionPrompts: 1 = no interaction icons/prompts on the HUD (you use things with your hands)
HideInteractionPrompts=0
; (ReticleDot=1 now also hides every game reticle, including turret and vehicle-gun reticles; the dot only shows for guns)
; v88
; MapPitch/MapYaw/MapRoll: both hands while the map/GPS is out (set them in the End-key menu, second page)
MapPitch=-30
MapYaw=-20
MapRoll=15
; v102: Free hands page of the End menu: pitch/yaw/roll of an empty hand (left hand off the weapon, right hand with nothing equipped; mirrored for the left)
FreeHandPitch=-15
FreeHandYaw=-15
FreeHandRoll=10
; v89
; HideHurtOverlay: 1 = no red damage borders / hit direction markers on the HUD
HideHurtOverlay=1
; BodyRadius: held objects are kept at least this far from your body's centre line (m), and move gently next to it
BodyRadius=0.30
; Buttons: X (left) = syrette / heal, left trigger = reload (or grenade throw while the right grip is held)
; v90
; SteadyHands: 1 = the hands keep the weapon's normal hold (no sprint sway, no pulling the gun in near walls)
SteadyHands=1
; GrabBoxShrink: objects' bounding boxes are shrunk by this share before GrabReach is measured (higher = closer)
GrabBoxShrink=0.25
; v104: interaction prompt (hand print) shown again - its keys 64x64x77v6,256x32x77v6,256x32x77v36,8x8x71v30,8x8x71v6 were removed from the list
; v106: 64x64x77v6#d8a4a289 and #f10a347f = weapon reticles (shotgun etc.); the hand print (#ef638bac, #60ccf2d6) stays
UiSkipTex=256x512x71v18,128x32x77v6,512x256x71v24,8x16x77v24,8x16x77v12,64x64x77v6#d8a4a289,64x64x77v6#f10a347f,64x64x77v6#72fa7106
; v92: UiSkipTex now also hides: shotgun reticle 128x32x77v6; interaction prompt 64x64x77v6 + 256x32x77v6/v36 + 8x8x71v30/v6;
;      damage overlay 512x256x71v24 + 8x16x77v24/v12. Remove an entry if something you need disappears.
; v93
; IronSights: 0 = weapons without a scope never get the game's iron-sight pose (it pulled the gun to the body); 1 = old behaviour
IronSights=0
; ScopeTestMs: a weapon held at your face this long (ms) without the game zooming in is treated as having no scope
ScopeTestMs=500
; v94
; TurnFullSpeed: 1 = any clear left/right push of the right stick (also diagonals) turns at full speed; 0 = speed follows how far the stick is pushed
TurnFullSpeed=1
; v231 CameraOnBodyClock: 1 = the view follows the player's body on the same game frame (no body / arm / weapon jitter while moving)
CameraOnBodyClock=1
; v231 HandsOnBodyClock: 1 = the hands and weapon follow the body's movement since the controller pose was taken
HandsOnBodyClock=1
; v231 MovementDirection: 0 = the left stick walks where the body faces, 1 = where the head looks
MovementDirection=0
; v231 RoomScale: 1 = walking around the room moves the player (the body follows the head; walls stop it).
;   RoomScaleLeash (m): the head may move this far from the body before it follows (leaning).
;   RoomScaleMaxSpeed (m/s), RoomScaleWallDistance (m: the body stops this far short of walls),
;   RoomScaleViewDelay (frames, 0-3): when the view takes the body's move into account
RoomScale=0
RoomScaleLeash=0.10
RoomScaleMaxSpeed=4.0
RoomScaleWallDistance=0.30
RoomScaleViewDelay=1
; SnapTurn: degrees turned per push of the right stick (snap turning); 0 = smooth turning
SnapTurn=0
; WatchStickSign: safehouse watch - the right stick left/right sets the alarm time; -1 reverses the direction
WatchStickSign=1
; TestCheats: 1 = god mode + unlimited ammo from the start (temporary, for testing); F11 toggles it in game
TestCheats=0
; v95: climbing (first version)
; Climbing: 1 = grip a building with your hand against it to hold on; pull down to go up; a hold below your chest pulls you over the edge
Climbing=0
; ClimbReach: how close the hand must be to the surface (m); MantleBelowHead: how far below your eyes the hold must be to climb over (m)
ClimbReach=0.18
MantleBelowHead=0.55
; ClimbGrace: after letting go of every hold you hang this long (seconds); any grip press in that time catches a new hold
ClimbGrace=0.75
; ClimbTurnSpeed: right-stick turning while on a wall (degrees per second; used if the game doesn't turn you itself)
ClimbTurnSpeed=120
; v103: ClimbHolster: 1 = the weapon is put away when you grab a wall and comes back when you are on the roof (or let go)
ClimbHolster=1
; GripInteract: 0 = grips only grab and climb, X interacts (E); 1 = an empty grip press also interacts
GripInteract=0
; ClimbMode: how your body is moved while climbing (testing): 0 = set position, 1 = velocity, 2 = controller taken out of physics.
ClimbMode=2
; v107: NVIDIA DLSS / DLAA (RTX GPU). Runs in bin\fc2vr_dlss\fc2vr_dlss_host64.exe beside nvngx_dlss.dll (DLSS is 64-bit only).
; Dlss: 1 = DLSS on each eye image
Dlss=1
; v198: DlssQuality: 0 = DLAA (native), 1 = Ultra Quality (77% render), 2 = Quality (67%), 3 = Balanced (58%), 4 = Performance (50%), 5 = Ultra Performance (33%)
;   below DLAA the eyes render smaller and DLSS rebuilds them at full size (AFW needs DLAA)
DlssQuality=0
; DlssPreset: 11 = K, 10 = J, 13 = M, 12 = L (transformer), 16 = NVIDIA recommended per mode
DlssPreset=10
; DlssLodBias: 1 = sharper texture detail when upscaling (mip bias of log2(render / output), as NVIDIA advises)
DlssLodBias=1
; DlssJitter: sub-pixel camera jitter DLSS needs to rebuild detail; DlssJitterPhases: length of the jitter sequence
DlssJitter=1
DlssJitterPhases=16
; DlssMask: 1 = the arms and weapon (near pass) take the current image (no ghosting on them)
DlssMask=1
DlssSharpness=0
; DlssAutoExposure: 1 = DLSS computes its own exposure (meant for HDR input; the eye image is LDR, 0 keeps its brightness)
DlssAutoExposure=0
; v112: AFW - Alternate Frame Warping (EXPERIMENTAL, for weaker GPUs). One eye is rendered per frame, alternating;
; the other eye is rebuilt from its own last image and the fresh eye's, using depth (set in the launcher).
; While AFW is on, DLSS is off.
Afw=0
; AfwGridStep: texels per warp-mesh vertex (2 = finest; 3-4 cheaper)
AfwGridStep=2
; AfwHandDepth: anything nearer than this in the depth image is your hands / weapon (FC2 stores them at 0.1-0.25, the ground starts near 0.5)
AfwHandDepth=0.3
AfwHandMinDepth=0.3
AfwDebug=0
; AfwHands: 0 = the rebuilt eye keeps its own hands from its last image, fixed to your view; 1 = takes them from the other eye by depth
AfwHands=0
; AfwHandMotion: the rebuilt eye's hands follow the controllers on screen: 0 off, 1 move, 2 move + turn
AfwHandMotion=2
PhonePitch=35
PhoneYaw=-90
PhoneRoll=95

; v146 throwing arc: hold a hand's grip, then pull its trigger (left hand: while it is not holding the weapon) - an arc and
;   a landing ring show where the grenade / molotov will land; let go to throw. Hold B still switches grenade / molotov.
; ThrowArc: 1 on, 0 off. ThrowArcRight: 1 = the right hand can throw too (while the right grip is held the gun does not fire).
; ThrowSpeed: throw speed in m/s (0 = the game's own throw strength)
ThrowArc=1
ThrowArcRight=1
ThrowSpeed=0
; ThrowRange: throw distance x this (1.5 = 50% further than the game's throw)
ThrowRange=1.5
; test: Shift+F11 fills grenades and molotovs to the maximum (adds them if you have none)

; v149 NPC grab: an empty hand's grip at an NPC or a body takes hold of the nearest body part; a living NPC is knocked
;   down (limp ragdoll) while held and NpcRagdollTime seconds after; letting go keeps the hand's speed (shove / throw).
; NpcGrab: 1 on / 0 off. NpcReach: m from the body. NpcPullGain: 0..1 (higher = stiffer pull). NpcMaxSpeed: m/s.
NpcGrab=0
NpcReach=0.25
NpcPullGain=0.6
NpcMaxSpeed=10
NpcRagdollTime=2.5
; v152: NpcActive 1 = a grabbed living NPC stays on its feet (its body follows its animation, the held limb follows your hand);
;   pulling the limb NpcKnockPull metres away from where its body wants it for a quarter second, or letting go with the
;   hand moving faster than NpcKnockSpeed m/s, knocks it down. 0 = every grab knocks down at once (v151).
NpcActive=1
NpcKnockPull=1.12
NpcKnockSpeed=2.1
; v153: NpcStiffness = how strongly a held standing NPC keeps its animated pose against your hand (x the game's own
;   strength; lower = the held limb follows your hand more). NpcActiveWeight = how much of the physical body the standing
;   NPC shows (1 = all).
NpcStiffness=1.0
NpcActiveWeight=1.0

; v154: a held standing NPC steps after a sideways pull (NpcLeadGain 1/s, at most NpcLeadSpeed m/s); pulling the held
;   limb NpcKnockDown m below where his body wants it pulls him to the ground; NpcKnockPull m away in any direction knocks him over.
NpcLeadGain=8.0
NpcLeadSpeed=4.5
NpcKnockDown=0.35

; v158 machete: swinging the blade into an NPC (tip faster than MacheteSwingSpeed m/s) lands the game's own machete hit
;   (same damage, blood and reactions as the flat game); the same NPC can be hit again after MacheteCooldown s.
MacheteHits=1
MacheteSwingSpeed=2.5
MacheteCooldown=0.5
; v205: MacheteSwingSound: 1 = the game's machete swoosh plays when the blade tip moves faster than MacheteSoundSpeed m/s relative to your body (hit or miss)
MacheteSwingSound=1
MacheteSoundSpeed=6.0
; MacheteSoundIds: the two sounds the game's own machete attack plays (hex)
MacheteSoundIds=4B2686,4B2689
; MacheteTriggerAttack: 1 = the right trigger also does the game's machete attack (its animation sways the camera); 0 = swing only
MacheteTriggerAttack=0
; v209: SteadyCamera: 1 = no camera bob / sway while running and sprinting (heading from the player, sideways and vertical bob smoothed)
SteadyCamera=1
; v207: SeatWeapon: 1 = a weapon the game re-attaches turned or shifted is put back in its recorded place in the hand
SeatWeapon=1
; v212-v219 monocular: with the map / GPS up, the right grip (away from the holster spots) takes the monocular out
;   and puts it back; held to the eye it opens its scope view, the right trigger tags things (the ring turns green
;   on anything taggable). Left Y, B or a holster grab put it away. Not offered during a phone call.
Monocular=1
; MonocularForward: the monocular view starts this far (m) in front of the eye (past the hand holding it)
MonocularForward=0.30
; MonocularViewScale: the monocular view is cropped this much tighter than the window (1.0 = same as gun scopes)
MonocularViewScale=1.15
; MonocularRingSize: the targeting ring's size as a part of the window (0.05 - 0.97)
MonocularRingSize=0.90
; v220 Flashlight: 1 = a head-mounted light; raise the left hand to the left temple and pull the left trigger to switch
;   it on / off (no reload then). FlashlightRange (m), FlashlightInnerAngle / FlashlightOuterAngle (degrees, bright
;   centre / edge of the beam), FlashlightBrightness (colour scale), FlashlightForward (m in front of the eyes),
;   FlashlightGestureRadius (m, how close the hand must be to the temple)
Flashlight=0
FlashlightRange=30
FlashlightInnerAngle=18
FlashlightOuterAngle=32
FlashlightBrightness=1.0
FlashlightForward=0.10
FlashlightGestureRadius=0.13
; v221 mounted guns: either stick aims (left/right, up/down); TurretInvertY: 1 = stick up lowers the gun
TurretInvertY=0
; v222 RecenterHoldMs: hold the left stick in this long (ms) to recenter ("Recentering 3, 2, 1"); 0 = off
RecenterHoldMs=1000
; v223 NoColorFilter: 1 = no colour grading / desaturation ("brown filter"); NoRimLight: 1 = no rim lighting on characters
NoColorFilter=0
NoRimLight=0
; v224 SmoothTurnSpeed: smooth turning speed (1.0 = the game's full stick, 0.2 - 3.0); Home in game: Left / Right arrows
SmoothTurnSpeed=1.0
; v225 CoreLimit: the game uses at most this many logical processors (it doesn't start on more than 16) - applied by the
;   mod itself, so FarCry2VR.exe also starts on its own. DevKeys: 1 = the developer test keys (F2 F3 F5 F6 F7 F10 F11 Pause)
CoreLimit=16
DevKeys=0
; v230 TimerFix: 1 = keep the 1 ms Windows timer while the game window is in the background (Windows 11 otherwise
;   drops it to 15.6 ms for background windows, which can cap VR at ~64 fps). 0 = off
TimerFix=1
; v230 DisplayRefreshRate: ask the headset for this refresh rate in Hz (e.g. 72, 80, 90, 120); 0 = leave it to the runtime
DisplayRefreshRate=0
; v227 HudTopBand / HudTopDrop: the top part of the HUD (objective updates, tutorial messages) is shown lowered toward
;   the upper middle of the view: HudTopBand = how much of the HUD height counts as the top strip, HudTopDrop = how far down
HudTopBand=0.22
